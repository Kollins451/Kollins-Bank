<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Kollins Bank</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<header class="auth-header">
    <a href="index.html" class="logo">
        <span class="logo-icon">K</span>
        <span>Kollins Bank</span>
    </a>

    <a href="login.html" class="back-link">
        Already have an account? <strong>Login</strong>
    </a>
</header>

<main class="auth-container">

    <div class="auth-card">

        <div class="auth-heading">
            <span class="eyebrow">KOLLINS BANK</span>
            <h1>Create your account</h1>
            <p>
                Enter your details below to begin your account registration.
            </p>
        </div>

        <form id="signupForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter first name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter last name"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Create password</label>

                <div class="password-field">
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a strong password"
                        required
                    >

                    <button type="button" class="show-password"
                        onclick="togglePassword('password', this)">
                        Show
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>

                <div class="password-field">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        required
                    >

                    <button type="button" class="show-password"
                        onclick="togglePassword('confirmPassword', this)">
                        Show
                    </button>
                </div>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" id="terms" required>
                <span>
                    I agree to the Terms of Service and Privacy Policy.
                </span>
            </label>

            <button type="submit" class="auth-button">
                Create Account
            </button>

            <div id="signupMessage" class="form-message"></div>

        </form>

        <p class="auth-footer-text">
            Already registered?
            <a href="login.html">Login to your account</a>
        </p>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
